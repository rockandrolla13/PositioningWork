[project]
name = "posmon"
version = "1.0.0"
description = "Reference implementation of the positioning and Pain Monitor specification"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11"]

[project.optional-dependencies]
test = ["pytest>=8", "statsmodels>=0.14"]
figures = ["matplotlib>=3.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["posmon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
